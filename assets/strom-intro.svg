<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#02050c"/><stop offset=".45" stop-color="#07172a"/><stop offset="1" stop-color="#030711"/>
  </linearGradient>
  <radialGradient id="a"><stop stop-color="#45e9ff" stop-opacity=".22"/><stop offset="1" stop-color="#45e9ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b"><stop stop-color="#5577ff" stop-opacity=".18"/><stop offset="1" stop-color="#5577ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#69eaff" stroke-opacity=".075"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<rect x="2" y="2" width="1196" height="296" rx="27" fill="url(#grid)"/>

<ellipse cx="180" cy="145" rx="260" ry="170" fill="url(#a)"/>
<ellipse cx="1010" cy="130" rx="300" ry="180" fill="url(#b)"/>

<g fill="#7cefff">
  <circle cx="85" cy="58" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="72" r="1.8"><animate attributeName="opacity" values="1;.15;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="101" cy="240" r="1.5"><animate attributeName="opacity" values=".1;.9;.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="235" r="2"><animate attributeName="opacity" values=".8;.1;.8" dur="3.1s" repeatCount="indefinite"/></circle>
</g>

<g fill="none" stroke-linecap="round" filter="url(#glow)">
  <path d="M55 103 L91 80 L78 113 L119 91" stroke="#5cecff" stroke-width="3">
    <animate attributeName="opacity" values=".15;1;.15" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M1080 190 L1114 165 L1102 198 L1144 176" stroke="#657dff" stroke-width="3">
    <animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/>
  </path>
</g>

<g fill="none" stroke="#62eaff" opacity=".18">
  <path d="M0 250 C190 185 260 285 470 230 S820 175 1200 245" stroke-width="2"/>
  <path d="M0 263 C190 198 260 298 470 243 S820 188 1200 258" stroke="#617cff" stroke-width="2"/>
</g>

<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="600" y="82" fill="#7defff" font-size="13" font-weight="700" letter-spacing="5">⚡ STROMXAKASH / SYSTEM PROFILE</text>
  <text x="600" y="137" fill="#ffffff" font-size="31" font-weight="900" letter-spacing="1">I BUILD DIGITAL SYSTEMS THAT FEEL ALIVE.</text>
  <text x="600" y="178" fill="#b9d6e6" font-size="15">FULL-STACK DEVELOPMENT  •  MINECRAFT INFRASTRUCTURE  •  DISCORD AUTOMATION</text>
  <text x="600" y="202" fill="#8ba9bb" font-size="15">CLOUD DEPLOYMENTS  •  FUTURISTIC UI  •  SYSTEM ENGINEERING</text>

  <g transform="translate(600 245)">
    <rect x="-151" y="-18" width="302" height="36" rx="18" fill="#071d2d" stroke="#55eaff" stroke-opacity=".55"/>
    <circle cx="-122" cy="0" r="4" fill="#61f5ff">
      <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-104" y="5" text-anchor="start" fill="#c8f8ff" font-size="12" font-weight="700" letter-spacing="2">CREATIVE ENGINEERING MODE</text>
  </g>
</g>
</svg>